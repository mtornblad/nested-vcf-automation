formatVersion: 2
inputs:
  lab_name:
    type: string
    title: Lab Name
    default: nested-vcf-lab
    description: Short DNS-compatible name used as the prefix for generated VPC and namespace names
  dns_prefix:
    type: string
    title: DNS Hostname Prefix
    default: mt
    description: Prefix added to every generated hostname (for example, 'mt' produces 'mtvc01')
  domain_name:
    type: string
    title: Domain Name
    default: dclab.se
    description: DNS domain for the nested environment (for example, dclab.se)
  dns_forwarder:
    type: string
    title: Upstream DNS Server
    default: 1.1.1.1
    description: IPv4 address of the upstream resolver used by the VyOS forwarding service
  ntp_server:
    type: string
    title: Upstream NTP Server
    default: time1.vyos.net
    description: IP address or FQDN of the upstream NTP server used by VyOS
  fabric_mtu:
    type: integer
    title: Nested Fabric MTU
    default: 9000
    minimum: 1600
    maximum: 9000
    description: IP MTU for the nested VyOS trunk, VCF system networks, and distributed switch; the outer NSX transport and physical network need additional encapsulation headroom
  vsan_allow_hcl_incompatible_disks:
    type: boolean
    title: Allow auto claim of HCL incompatible disks
    default: true
    description: Allow vSAN ESA to claim non-HCL disks in the nested lab; maps to skipHclAutoDiskClaim in the VCF specification
  install_automation:
    type: boolean
    title: Install Aria Automation (Day 2)
    default: false
    description: Include VCF Automation in the generated VCF deployment specification
  esx_vsan_disk_enabled:
    type: boolean
    title: Add Nested vSAN Disk
    default: true
    description: Create and attach one additional NVMe block volume to every nested ESXi host
  esx_vsan_disk_size_gib:
    type: integer
    title: Nested vSAN Disk Size (GiB)
    default: 100
    minimum: 1
    description: Capacity of the additional NVMe block volume attached to each nested ESXi host
  lab_password:
    type: string
    title: Shared Lab Password
    encrypted: false
    minLength: 15
    description: Plaintext credential for this disposable lab deployment; visible in the request and generated JSON
  vyos_rest_api_key:
    type: string
    title: VyOS REST API Key
    encrypted: false
    minLength: 12
    description: Plaintext full-access REST API key for the disposable lab VyOS router
variables:
  bootstrap_secret_name: ${input.lab_name}-bootstrap-${env.shortDeploymentId}
  # --- Namespace & Environment Settings ---
  namespace_settings:
    generate_name: ${input.lab_name}-ns
    region_name: region-dclab
    class_name: x-large
    seg_name: pco
    storage:
      policy: vsan-default-storage-policy
      limit: 8192Gi
    zone:
      name: domain-c9
      cpu_limit: 40G
      cpu_reservation: '0'
      memory_limit: 40000Mi
      memory_reservation: '0'
  # --- VPC Settings ---
  vpc_settings:
    network: 172.16.0.0/16
    generate_name: ${input.lab_name}-vpc
    attachment_generate_name: ${input.lab_name}-attachment
    nat_rule_name: ${input.lab_name}-rdp
    ip_alloc_name: ${input.lab_name}-external-ip
  # --- VyOS Settings ---
  vyos_settings:
    vm_image: vmi-576b17f7f8892d741
    vm_class: best-effort-medium
    hostname: ${input.dns_prefix}vyos01
    fqdn: ${input.dns_prefix}vyos01.${input.domain_name}
    mgmt_ip: 172.16.0.2
    mgmt_mask: '24'
    mgmt_gw: 172.16.0.1
    management_network: ${variable.netlayout.uplink.name}
    trunk_network: ${variable.netlayout.trunk.name}
    password: ${input.lab_password}
    enable_ssh: 'true'
    enable_rest: 'true'
    rest_api_key: ${input.vyos_rest_api_key}
    dns:
      local_resolver: 127.0.0.1
      forwarder: ${input.dns_forwarder}
      allow_from: ${variable.vpc_settings.network}
      additional_a_records:
        - zone: dclab.se
          name: vis-appliance
          address: 10.114.10.9
    ntp:
      upstream_server: ${input.ntp_server}
      allow_from: ${variable.vpc_settings.network}
  # --- ESXi Settings ---
  esx_settings:
    vm_image: vmi-ade283728d7174041
    vm_class: nested-esx-small
    vsan_disk:
      enabled: ${input.esx_vsan_disk_enabled}
      size: ${to_string(input.esx_vsan_disk_size_gib)}Gi
      storage_class: ${variable.namespace_settings.storage.policy}
      claim_suffix: vsan-capacity
    credentials:
      username: root
      password: ${input.lab_password}
    servers:
      - name: ${input.dns_prefix}esx01
        ip: 172.16.1.101
      - name: ${input.dns_prefix}esx02
        ip: 172.16.1.102
      - name: ${input.dns_prefix}esx03
        ip: 172.16.1.103
  # --- Installer Settings ---
  installer_settings:
    vm_image: vmi-992f6225042baf914
    vm_class: best-effort-large
    ip: ${variable.net_prefix}.10
    hostname: ${input.dns_prefix}vcf-installer
    fqdn: ${input.dns_prefix}vcf-installer.${input.domain_name}
    credentials:
      root_password: ${input.lab_password}
      local_user_password: ${input.lab_password}
  # --- Jumphost Settings ---
  jumphost_settings:
    vm_image: vmi-bb0ae6c186c4d4448
    vm_class: best-effort-medium
    ip: 172.16.0.4
    hostname: ${input.dns_prefix}jump01
    credentials:
      admin_password: ${input.lab_password}
  # --- VCF Component Settings ---
  vcf_settings:
    vsan:
      allow_hcl_incompatible_disks: ${input.vsan_allow_hcl_incompatible_disks}
    vsp:
      ip_pool:
        start: ${variable.net_prefix}.110
        end: ${variable.net_prefix}.199
      internal_cluster_cidr: 240.0.0.0/15
      system_user_password: ${input.lab_password}
    nsx:
      admin_password: ${input.lab_password}
      audit_password: ${input.lab_password}
      root_password: ${input.lab_password}
    operations:
      admin_password: ${input.lab_password}
      root_password: ${input.lab_password}
    operations_collector:
      root_password: ${input.lab_password}
    vcenter:
      admin_sso_password: ${input.lab_password}
      root_password: ${input.lab_password}
    sddc_manager:
      hostname: ${input.dns_prefix}sddcm01
      fqdn: ${input.dns_prefix}sddcm01.${input.domain_name}
      ip: ${variable.net_prefix}.207
      local_user_password: ${input.lab_password}
      root_password: ${input.lab_password}
      ssh_password: ${input.lab_password}
    automation:
      admin_password: ${input.lab_password}
      internal_cluster_cidr: 198.18.0.0/15
      ip_pool:
        - ${variable.net_prefix}.20
        - ${variable.net_prefix}.21
        - ${variable.net_prefix}.22
        - ${variable.net_prefix}.23
        - ${variable.net_prefix}.24
        - ${variable.net_prefix}.25
        - ${variable.net_prefix}.26
        - ${variable.net_prefix}.27
        - ${variable.net_prefix}.28
        - ${variable.net_prefix}.29
        - ${variable.net_prefix}.30
        - ${variable.net_prefix}.31
        - ${variable.net_prefix}.32
        - ${variable.net_prefix}.33
        - ${variable.net_prefix}.34
        - ${variable.net_prefix}.35
        - ${variable.net_prefix}.36
        - ${variable.net_prefix}.37
        - ${variable.net_prefix}.38
        - ${variable.net_prefix}.39
        - ${variable.net_prefix}.40
        - ${variable.net_prefix}.41
        - ${variable.net_prefix}.42
        - ${variable.net_prefix}.43
        - ${variable.net_prefix}.44
        - ${variable.net_prefix}.45
        - ${variable.net_prefix}.46
        - ${variable.net_prefix}.47
        - ${variable.net_prefix}.48
        - ${variable.net_prefix}.49
        - ${variable.net_prefix}.50
        - ${variable.net_prefix}.51
        - ${variable.net_prefix}.52
        - ${variable.net_prefix}.53
        - ${variable.net_prefix}.54
        - ${variable.net_prefix}.55
        - ${variable.net_prefix}.56
        - ${variable.net_prefix}.57
        - ${variable.net_prefix}.58
        - ${variable.net_prefix}.59
        - ${variable.net_prefix}.60
        - ${variable.net_prefix}.61
        - ${variable.net_prefix}.62
        - ${variable.net_prefix}.63
        - ${variable.net_prefix}.64
        - ${variable.net_prefix}.65
        - ${variable.net_prefix}.66
        - ${variable.net_prefix}.67
        - ${variable.net_prefix}.68
        - ${variable.net_prefix}.69
        - ${variable.net_prefix}.70
        - ${variable.net_prefix}.71
        - ${variable.net_prefix}.72
        - ${variable.net_prefix}.73
        - ${variable.net_prefix}.74
        - ${variable.net_prefix}.75
        - ${variable.net_prefix}.76
        - ${variable.net_prefix}.77
        - ${variable.net_prefix}.78
        - ${variable.net_prefix}.79
        - ${variable.net_prefix}.80
        - ${variable.net_prefix}.81
        - ${variable.net_prefix}.82
        - ${variable.net_prefix}.83
        - ${variable.net_prefix}.84
        - ${variable.net_prefix}.85
        - ${variable.net_prefix}.86
        - ${variable.net_prefix}.87
        - ${variable.net_prefix}.88
        - ${variable.net_prefix}.89
        - ${variable.net_prefix}.90
        - ${variable.net_prefix}.91
        - ${variable.net_prefix}.92
        - ${variable.net_prefix}.93
        - ${variable.net_prefix}.94
        - ${variable.net_prefix}.95
        - ${variable.net_prefix}.96
        - ${variable.net_prefix}.97
        - ${variable.net_prefix}.98
        - ${variable.net_prefix}.99
  # --- Network layout ---
  netlayout:
    mgmt:
      name: vlan1601
      vlanid: 1601
      ipaddresses: 172.16.1.0/24
      defaultgw: 172.16.1.1
      description: Management
      access_mode: Private
      connectivity_state: Disconnected
    vmotion:
      name: vlan1602
      vlanid: 1602
      ipaddresses: 172.16.2.0/24
      defaultgw: 172.16.2.1
      description: vMotion
      access_mode: Private
      connectivity_state: Disconnected
      ip_pool:
        start: 172.16.2.2
        end: 172.16.2.100
    vsan:
      name: vlan1603
      vlanid: 1603
      ipaddresses: 172.16.3.0/24
      defaultgw: 172.16.3.1
      description: vSAN/Storage
      access_mode: Private
      connectivity_state: Disconnected
      ip_pool:
        start: 172.16.3.2
        end: 172.16.3.100
    tep:
      name: vlan1604
      vlanid: 1604
      ipaddresses: 172.16.4.0/24
      defaultgw: 172.16.4.1
      description: ESXi & NSX Edge Tunnel Endpoint (TEP)
      access_mode: Private
      connectivity_state: Disconnected
      ip_pool:
        name: mgmt-cl01-tep01
        description: ESXi Host Overlay TEP IP Pool
        start: 172.16.4.10
        end: 172.16.4.100
    vpc:
      name: vlan1605
      vlanid: 1605
      ipaddresses: 172.16.5.0/24
      defaultgw: 172.16.5.1
      description: NSX Edge T0 Uplink
      access_mode: Private
      connectivity_state: Disconnected
    trunk:
      name: trunk
      ipaddresses: 172.16.100.0/24
      defaultgw: 172.16.100.1
      mtu: ${input.fabric_mtu}
      description: Trunk interface for VyOS and ESXi
      access_mode: Private
      connectivity_state: Disconnected
    uplink:
      name: uplink
      ipaddresses: 172.16.0.0/24
      defaultgw: 172.16.0.1
      description: VPC Uplink network
      access_mode: Private
      connectivity_state: Connected
  # --- Derived IP prefixes and reverse zones ---
  mgmt_oct1: ${split(variable.netlayout.mgmt.ipaddresses, '.')[0]}
  mgmt_oct2: ${split(variable.netlayout.mgmt.ipaddresses, '.')[1]}
  mgmt_oct3: ${split(variable.netlayout.mgmt.ipaddresses, '.')[2]}
  uplink_oct1: ${split(variable.netlayout.uplink.ipaddresses, '.')[0]}
  uplink_oct2: ${split(variable.netlayout.uplink.ipaddresses, '.')[1]}
  uplink_oct3: ${split(variable.netlayout.uplink.ipaddresses, '.')[2]}
  net_prefix: ${variable.mgmt_oct1}.${variable.mgmt_oct2}.${variable.mgmt_oct3}
  # Reverse zones derived from the management and uplink subnets
  rev_zone_mgmt: ${variable.mgmt_oct3}.${variable.mgmt_oct2}.${variable.mgmt_oct1}.in-addr.arpa
  rev_zone_uplink: ${variable.uplink_oct3}.${variable.uplink_oct2}.${variable.uplink_oct1}.in-addr.arpa
  # --- VyOS supplemental configuration ---
  vyos_config: |
    set interfaces ethernet __TRUNK_INTERFACE__ address ${variable.netlayout.trunk.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ mtu ${variable.netlayout.trunk.mtu}
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.mgmt.vlanid} address ${variable.netlayout.mgmt.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.mgmt.vlanid} mtu ${variable.netlayout.trunk.mtu}
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vmotion.vlanid} address ${variable.netlayout.vmotion.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vmotion.vlanid} mtu ${variable.netlayout.trunk.mtu}
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vsan.vlanid} address ${variable.netlayout.vsan.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vsan.vlanid} mtu ${variable.netlayout.trunk.mtu}
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.tep.vlanid} address ${variable.netlayout.tep.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.tep.vlanid} mtu ${variable.netlayout.trunk.mtu}
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vpc.vlanid} address ${variable.netlayout.vpc.defaultgw}/24
    set interfaces ethernet __TRUNK_INTERFACE__ vif ${variable.netlayout.vpc.vlanid} mtu ${variable.netlayout.trunk.mtu}
    set nat source rule 100 outbound-interface name __MANAGEMENT_INTERFACE__
    set nat source rule 100 translation address masquerade

    set service dns forwarding listen-address ${variable.vyos_settings.dns.local_resolver}
    set service dns forwarding listen-address ${variable.vyos_settings.mgmt_ip}
    set service dns forwarding allow-from 127.0.0.0/8
    set service dns forwarding allow-from ${variable.vyos_settings.dns.allow_from}
    set service dns forwarding name-server ${variable.vyos_settings.dns.forwarder}
    set service dns forwarding ignore-hosts-file

    set service ntp listen-address ${variable.vyos_settings.mgmt_ip}
    set service ntp allow-client address ${variable.vyos_settings.ntp.allow_from}

    # --- Generated DNS A records ---
    %{for record in variable.vyos_settings.dns.additional_a_records}
    set service dns forwarding authoritative-domain ${record.zone} records a ${record.name} address ${record.address}
    %{endfor}
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${variable.vyos_settings.hostname} address ${variable.vyos_settings.mgmt_ip}
    %{for host in variable.esx_settings.servers}
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${host.name} address ${host.ip}
    %{endfor}
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}vc01 address ${variable.net_prefix}.200
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}nsx01 address ${variable.net_prefix}.201
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}nsx02 address ${variable.net_prefix}.202
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}ops01 address ${variable.net_prefix}.203
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}collector address ${variable.net_prefix}.204
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}auto-vip address ${variable.net_prefix}.205
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}auto-platform address ${variable.net_prefix}.206
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}vsp01 address ${variable.net_prefix}.208
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}fleetlcm address ${variable.net_prefix}.209
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}shared01 address ${variable.net_prefix}.210
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}vidb address ${variable.net_prefix}.211
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${input.dns_prefix}license address ${variable.net_prefix}.212
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${variable.installer_settings.hostname} address ${variable.installer_settings.ip}
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${variable.vcf_settings.sddc_manager.hostname} address ${variable.vcf_settings.sddc_manager.ip}
    set service dns forwarding authoritative-domain ${input.domain_name} records a ${variable.jumphost_settings.hostname} address ${variable.jumphost_settings.ip}

    # --- Generated DNS PTR records ---
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 10 target ${variable.installer_settings.fqdn}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr ${split(variable.vcf_settings.sddc_manager.ip, '.')[3]} target ${variable.vcf_settings.sddc_manager.fqdn}
    %{for host in variable.esx_settings.servers}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr ${split(host.ip, '.')[3]} target ${host.name}.${input.domain_name}
    %{endfor}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 200 target ${input.dns_prefix}vc01.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 201 target ${input.dns_prefix}nsx01.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 202 target ${input.dns_prefix}nsx02.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 203 target ${input.dns_prefix}ops01.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 204 target ${input.dns_prefix}collector.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 205 target ${input.dns_prefix}auto-vip.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 206 target ${input.dns_prefix}auto-platform.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 208 target ${input.dns_prefix}vsp01.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 209 target ${input.dns_prefix}fleetlcm.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 210 target ${input.dns_prefix}shared01.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 211 target ${input.dns_prefix}vidb.${input.domain_name}
    set service dns forwarding authoritative-domain ${variable.rev_zone_mgmt} records ptr 212 target ${input.dns_prefix}license.${input.domain_name}

    set service dns forwarding authoritative-domain ${variable.rev_zone_uplink} records ptr 2 target ${variable.vyos_settings.fqdn}
    set service dns forwarding authoritative-domain ${variable.rev_zone_uplink} records ptr 4 target ${variable.jumphost_settings.hostname}.${input.domain_name}
resources:
  VPC_Main:
    type: CCI.VPC
    properties:
      regionName: ${variable.namespace_settings.region_name}
      generateName: ${variable.vpc_settings.generate_name}
      privateIPs:
        - ${variable.vpc_settings.network}
  VPC_Attachment:
    type: CCI.VPC.Configuration
    properties:
      vpc: ${resource.VPC_Main.id}
      kind: VPCAttachment
      configs:
        - generateName: ${variable.vpc_settings.attachment_generate_name}
          spec:
            vpcConnectivityProfileName: default--${variable.namespace_settings.region_name}
      apiVersion: vpc.nsx.vmware.com/v1alpha1
  VPC_IP_Allocation:
    type: CCI.VPC.Configuration
    dependsOn:
      - VPC_Attachment
    properties:
      vpc: ${resource.VPC_Main.id}
      kind: VPCIPAddressAllocation
      configs:
        - generateName: ${variable.vpc_settings.ip_alloc_name}
          spec:
            ipAddressBlockVisibility: External
      apiVersion: vpc.nsx.vmware.com/v1alpha1
  VPC_NAT_Rule_RDP:
    type: CCI.VPC.Configuration
    dependsOn:
      - VPC_IP_Allocation
    properties:
      vpc: ${resource.VPC_Main.id}
      kind: VPCNATRule
      configs:
        - generateName: ${variable.vpc_settings.nat_rule_name}
          spec:
            action: DNAT
            destinationNetwork: ${resource.VPC_IP_Allocation.configs.spec.allocationIPs[0]}
            enabled: true
            firewallMatch: MatchInternalAddress
            logging: false
            sequenceNumber: 0
            translatedNetwork: ${variable.jumphost_settings.ip}
            serviceEntry:
              destinationPorts: '3389'
              protocol: TCP
              translatedPorts: '3389'
      apiVersion: vpc.nsx.vmware.com/v1alpha1
      wait:
        conditions:
          - type: Realized
            status: 'True'
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      vpcName: ${resource.VPC_Main.name}
      className: ${variable.namespace_settings.class_name}
      regionName: ${variable.namespace_settings.region_name}
      generateName: ${variable.namespace_settings.generate_name}
      existing: false
      segName: ${variable.namespace_settings.seg_name}
      storageClasses:
        - name: ${variable.namespace_settings.storage.policy}
          limit: ${to_string(variable.namespace_settings.storage.limit)}
      zones:
        - name: ${variable.namespace_settings.zone.name}
          cpuLimit: ${to_string(variable.namespace_settings.zone.cpu_limit)}
          cpuReservation: ${to_string(variable.namespace_settings.zone.cpu_reservation)}
          memoryLimit: ${to_string(variable.namespace_settings.zone.memory_limit)}
          memoryReservation: ${to_string(variable.namespace_settings.zone.memory_reservation)}
  # --- Management Network ---
  Subnet_mgmt:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.mgmt.name}
        spec:
          accessMode: ${variable.netlayout.mgmt.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.mgmt.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.mgmt.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  SubnetConnectionBindingMap_mgmt:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_mgmt
      - Subnet_trunk
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: SubnetConnectionBindingMap
        metadata:
          name: binding-${variable.netlayout.mgmt.name}
        spec:
          subnetName: ${variable.netlayout.mgmt.name}
          targetSubnetName: ${variable.netlayout.trunk.name}
          vlanTrafficTag: ${variable.netlayout.mgmt.vlanid}
  # --- vMotion Network ---
  Subnet_vmotion:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.vmotion.name}
        spec:
          accessMode: ${variable.netlayout.vmotion.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.vmotion.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.vmotion.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  SubnetConnectionBindingMap_vmotion:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_vmotion
      - Subnet_trunk
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: SubnetConnectionBindingMap
        metadata:
          name: binding-${variable.netlayout.vmotion.name}
        spec:
          subnetName: ${variable.netlayout.vmotion.name}
          targetSubnetName: ${variable.netlayout.trunk.name}
          vlanTrafficTag: ${variable.netlayout.vmotion.vlanid}
  # --- vSAN Network ---
  Subnet_vsan:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.vsan.name}
        spec:
          accessMode: ${variable.netlayout.vsan.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.vsan.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.vsan.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  SubnetConnectionBindingMap_vsan:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_vsan
      - Subnet_trunk
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: SubnetConnectionBindingMap
        metadata:
          name: binding-${variable.netlayout.vsan.name}
        spec:
          subnetName: ${variable.netlayout.vsan.name}
          targetSubnetName: ${variable.netlayout.trunk.name}
          vlanTrafficTag: ${variable.netlayout.vsan.vlanid}
  # --- TEP Network ---
  Subnet_tep:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.tep.name}
        spec:
          accessMode: ${variable.netlayout.tep.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.tep.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.tep.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  SubnetConnectionBindingMap_tep:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_tep
      - Subnet_trunk
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: SubnetConnectionBindingMap
        metadata:
          name: binding-${variable.netlayout.tep.name}
        spec:
          subnetName: ${variable.netlayout.tep.name}
          targetSubnetName: ${variable.netlayout.trunk.name}
          vlanTrafficTag: ${variable.netlayout.tep.vlanid}
  # --- VPC Uplink Network ---
  Subnet_vpc:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.vpc.name}
        spec:
          accessMode: ${variable.netlayout.vpc.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.vpc.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.vpc.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  SubnetConnectionBindingMap_vpc:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_vpc
      - Subnet_trunk
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: SubnetConnectionBindingMap
        metadata:
          name: binding-${variable.netlayout.vpc.name}
        spec:
          subnetName: ${variable.netlayout.vpc.name}
          targetSubnetName: ${variable.netlayout.trunk.name}
          vlanTrafficTag: ${variable.netlayout.vpc.vlanid}
  # --- Infrastructure Subnets ---
  Subnet_trunk:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.trunk.name}
        spec:
          accessMode: ${variable.netlayout.trunk.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.trunk.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.trunk.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  Subnet_uplink:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: crd.nsx.vmware.com/v1alpha1
        kind: Subnet
        metadata:
          name: ${variable.netlayout.uplink.name}
        spec:
          accessMode: ${variable.netlayout.uplink.access_mode}
          advancedConfig:
            connectivityState: ${variable.netlayout.uplink.connectivity_state}
            staticIPAllocation:
              enabled: true
          ipAddresses:
            - ${variable.netlayout.uplink.ipaddresses}
          subnetDHCPConfig:
            mode: DHCPDeactivated
  # --- Namespace-scoped bootstrap credentials ---
  Bootstrap_Secrets:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Namespace
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${variable.bootstrap_secret_name}
        type: Opaque
        stringData:
          lab-password: ${input.lab_password}
          vyos-rest-api-key: ${input.vyos_rest_api_key}
  # --- VyOS Machine ---
  VyOS_Machine:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_uplink
      - Subnet_trunk
      - Bootstrap_Secrets
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${variable.vyos_settings.hostname}-${env.shortDeploymentId}
        spec:
          className: ${variable.vyos_settings.vm_class}
          imageName: ${variable.vyos_settings.vm_image}
          powerState: PoweredOn
          storageClass: ${variable.namespace_settings.storage.policy}
          network:
            interfaces:
              - name: uplink
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${resource.Subnet_uplink.manifest.metadata.name}
              - name: trunk
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${resource.Subnet_trunk.manifest.metadata.name}
          bootstrap:
            vAppConfig:
              properties:
                - key: hostname
                  value:
                    value: ${variable.vyos_settings.fqdn}
                - key: ipaddress
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_ip)}
                - key: netmask
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_mask)}
                - key: gateway
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_gw)}
                - key: dns
                  value:
                    value: ${to_string(variable.vyos_settings.dns.local_resolver)}
                - key: domain
                  value:
                    value: ${to_string(input.domain_name)}
                - key: ntp
                  value:
                    value: ${to_string(variable.vyos_settings.ntp.upstream_server)}
                - key: password
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: lab-password
                - key: enable_ssh
                  value:
                    value: ${to_string(variable.vyos_settings.enable_ssh)}
                - key: enable_rest
                  value:
                    value: ${to_string(variable.vyos_settings.enable_rest)}
                - key: rest_api_key
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: vyos-rest-api-key
                - key: management_network
                  value:
                    value: ${to_string(variable.vyos_settings.management_network)}
                - key: trunk_network
                  value:
                    value: ${to_string(variable.vyos_settings.trunk_network)}
                - key: config_base64
                  value:
                    value: ${base64_encode(variable.vyos_config)}
          wait:
            conditions:
              - type: VirtualMachineCreated
                status: 'True'
  # --- Optional vSAN capacity disks ---
  ESXi_VSAN_Disks:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Namespace
    allocatePerInstance: true
    properties:
      count: '${variable.esx_settings.vsan_disk.enabled == true ? length(variable.esx_settings.servers) : 0}'
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${variable.esx_settings.servers[count.index].name}-${variable.esx_settings.vsan_disk.claim_suffix}
        spec:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          storageClassName: ${variable.esx_settings.vsan_disk.storage_class}
          resources:
            requests:
              storage: ${variable.esx_settings.vsan_disk.size}
  # --- ESXi Hosts with a vSAN capacity disk ---
  VM_ESXs:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_trunk
      - SubnetConnectionBindingMap_mgmt
      - SubnetConnectionBindingMap_vmotion
      - SubnetConnectionBindingMap_vsan
      - SubnetConnectionBindingMap_tep
      - SubnetConnectionBindingMap_vpc
      - VyOS_Machine
      - Bootstrap_Secrets
      - ESXi_VSAN_Disks
    allocatePerInstance: true
    properties:
      count: '${variable.esx_settings.vsan_disk.enabled == true ? length(variable.esx_settings.servers) : 0}'
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${variable.esx_settings.servers[count.index].name}
        spec:
          className: ${variable.esx_settings.vm_class}
          imageName: ${variable.esx_settings.vm_image}
          powerState: PoweredOn
          storageClass: ${variable.namespace_settings.storage.policy}
          hardware:
            nvmeControllers:
              - busNumber: 0
                sharingMode: None
          volumes:
            - name: vsan-capacity
              controllerType: NVME
              controllerBusNumber: 0
              unitNumber: 0
              diskMode: IndependentPersistent
              sharingMode: None
              persistentVolumeClaim:
                claimName: ${variable.esx_settings.servers[count.index].name}-${variable.esx_settings.vsan_disk.claim_suffix}
          network:
            interfaces:
              - name: eth0
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${variable.netlayout.trunk.name}
              - name: eth1
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${variable.netlayout.trunk.name}
          bootstrap:
            vAppConfig:
              properties:
                - key: guestinfo.password
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: lab-password
                - key: guestinfo.ipaddress
                  value:
                    value: ${to_string(variable.esx_settings.servers[count.index].ip)}
                - key: guestinfo.netmask
                  value:
                    value: 255.255.255.0
                - key: guestinfo.gateway
                  value:
                    value: ${to_string(variable.netlayout.mgmt.defaultgw)}
                - key: guestinfo.hostname
                  value:
                    value: ${variable.esx_settings.servers[count.index].name}.${input.domain_name}
                - key: guestinfo.dns
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_ip)}
                - key: guestinfo.domain
                  value:
                    value: ${to_string(input.domain_name)}
                - key: guestinfo.ntp
                  value:
                    value: ${to_string(variable.vyos_settings.fqdn)}
                - key: guestinfo.ssh
                  value:
                    value: 'true'
                - key: guestinfo.vlan
                  value:
                    value: ${to_string(variable.netlayout.mgmt.vlanid)}
          wait:
            conditions:
              - type: VirtualMachineCreated
                status: 'True'
  # --- ESXi Hosts without a vSAN capacity disk ---
  VM_ESXs_Boot_Only:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_trunk
      - SubnetConnectionBindingMap_mgmt
      - SubnetConnectionBindingMap_vmotion
      - SubnetConnectionBindingMap_vsan
      - SubnetConnectionBindingMap_tep
      - SubnetConnectionBindingMap_vpc
      - VyOS_Machine
      - Bootstrap_Secrets
    allocatePerInstance: true
    properties:
      count: '${variable.esx_settings.vsan_disk.enabled == true ? 0 : length(variable.esx_settings.servers)}'
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${variable.esx_settings.servers[count.index].name}
        spec:
          className: ${variable.esx_settings.vm_class}
          imageName: ${variable.esx_settings.vm_image}
          powerState: PoweredOn
          storageClass: ${variable.namespace_settings.storage.policy}
          network:
            interfaces:
              - name: eth0
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${variable.netlayout.trunk.name}
              - name: eth1
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${variable.netlayout.trunk.name}
          bootstrap:
            vAppConfig:
              properties:
                - key: guestinfo.password
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: lab-password
                - key: guestinfo.ipaddress
                  value:
                    value: ${to_string(variable.esx_settings.servers[count.index].ip)}
                - key: guestinfo.netmask
                  value:
                    value: 255.255.255.0
                - key: guestinfo.gateway
                  value:
                    value: ${to_string(variable.netlayout.mgmt.defaultgw)}
                - key: guestinfo.hostname
                  value:
                    value: ${variable.esx_settings.servers[count.index].name}.${input.domain_name}
                - key: guestinfo.dns
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_ip)}
                - key: guestinfo.domain
                  value:
                    value: ${to_string(input.domain_name)}
                - key: guestinfo.ntp
                  value:
                    value: ${to_string(variable.vyos_settings.fqdn)}
                - key: guestinfo.ssh
                  value:
                    value: 'true'
                - key: guestinfo.vlan
                  value:
                    value: ${to_string(variable.netlayout.mgmt.vlanid)}
          wait:
            conditions:
              - type: VirtualMachineCreated
                status: 'True'
  # --- VCF Installer VM ---
  Installer_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_mgmt
      - SubnetConnectionBindingMap_mgmt
      - VyOS_Machine
      - Bootstrap_Secrets
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${variable.installer_settings.hostname}
        spec:
          className: ${variable.installer_settings.vm_class}
          imageName: ${variable.installer_settings.vm_image}
          powerState: PoweredOn
          storageClass: ${variable.namespace_settings.storage.policy}
          network:
            interfaces:
              - addresses:
                  - ${variable.installer_settings.ip}/32
                name: eth0
                network:
                  name: ${variable.netlayout.mgmt.name}
                  kind: Subnet
          bootstrap:
            vAppConfig:
              properties:
                - key: ROOT_PASSWORD
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: lab-password
                - key: LOCAL_USER_PASSWORD
                  value:
                    from:
                      name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                      key: lab-password
                - key: vami.hostname
                  value:
                    value: ${variable.installer_settings.fqdn}
                - key: guestinfo.ntp
                  value:
                    value: ${to_string(variable.vyos_settings.fqdn)}
                - key: ip_address_version
                  value:
                    value: IPv4
                - key: ip0
                  value:
                    value: ${to_string(variable.installer_settings.ip)}
                - key: netmask0
                  value:
                    value: 255.255.255.0
                - key: gateway
                  value:
                    value: ${to_string(variable.netlayout.mgmt.defaultgw)}
                - key: domain
                  value:
                    value: ${to_string(input.domain_name)}
                - key: searchpath
                  value:
                    value: ${to_string(input.domain_name)}
                - key: DNS
                  value:
                    value: ${to_string(variable.vyos_settings.mgmt_ip)}
  # --- Windows Jumphost VM ---
  Jumphost_VM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Subnet_uplink
      - SubnetConnectionBindingMap_mgmt
      - SubnetConnectionBindingMap_vmotion
      - SubnetConnectionBindingMap_vsan
      - SubnetConnectionBindingMap_tep
      - SubnetConnectionBindingMap_vpc
      - VyOS_Machine
      - Bootstrap_Secrets
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${variable.jumphost_settings.hostname}
        spec:
          className: ${variable.jumphost_settings.vm_class}
          imageName: ${variable.jumphost_settings.vm_image}
          powerState: PoweredOn
          storageClass: ${variable.namespace_settings.storage.policy}
          network:
            hostName: ${variable.jumphost_settings.hostname}
            nameservers:
              - ${variable.vyos_settings.mgmt_ip}
            searchDomains:
              - ${input.domain_name}
            interfaces:
              - name: eth0
                addresses:
                  - ${variable.jumphost_settings.ip}/24
                gateway4: ${variable.netlayout.uplink.defaultgw}
                network:
                  apiVersion: crd.nsx.vmware.com/v1alpha1
                  kind: Subnet
                  name: ${variable.netlayout.uplink.name}
          bootstrap:
            sysprep:
              sysprep:
                guiRunOnce:
                  commands:
                    - route /p add ${split(variable.netlayout.mgmt.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                    - route /p add ${split(variable.netlayout.vmotion.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                    - route /p add ${split(variable.netlayout.vsan.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                    - route /p add ${split(variable.netlayout.tep.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                    - route /p add ${split(variable.netlayout.vpc.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                    - route /p add ${split(variable.netlayout.trunk.ipaddresses, '/')[0]} mask 255.255.255.0 ${variable.vyos_settings.mgmt_ip}
                guiUnattended:
                  autoLogon: true
                  autoLogonCount: 1
                  password:
                    name: ${resource.Bootstrap_Secrets.manifest.metadata.name}
                    key: lab-password
                userData:
                  fullName: DCLab Admin
                  orgName: DCLab
outputs:
  __deploymentOverview:
    value: |-
      ## VCF Lab Environment Overview

      The VMware Cloud Foundation lab resources have been provisioned.
      The table below summarizes the instances created in the namespace.

      #### Remote Access (RDP to Jumphost)
      **Public IP:** ${resource.VPC_IP_Allocation.configs.spec.allocationIPs[0]}
      **Port:** 3389
      **Username:** Administrator

      #### Virtual Machines
      <table class="table">
        <tr>
          <th>Role</th>
          <th>Hostname</th>
          <th>IP Address</th>
          <th>Username</th>
          <th>Class</th>
        </tr>
        <tr>
          <td><strong>VyOS Router</strong></td>
          <td>${variable.vyos_settings.hostname}.${input.domain_name}</td>
          <td>${variable.vyos_settings.mgmt_ip}</td>
          <td>vyos</td>
          <td><span class="label label-info">${variable.vyos_settings.vm_class}</span></td>
        </tr>
        <tr>
          <td><strong>Windows Jumphost</strong></td>
          <td>${variable.jumphost_settings.hostname}.${input.domain_name}</td>
          <td>${variable.jumphost_settings.ip}</td>
          <td>Administrator</td>
          <td><span class="label label-info">${variable.jumphost_settings.vm_class}</span></td>
        </tr>
        <tr>
          <td><strong>VCF Installer</strong></td>
          <td>${variable.installer_settings.hostname}.${input.domain_name}</td>
          <td>${variable.installer_settings.ip}</td>
          <td>root</td>
          <td><span class="label label-info">${variable.installer_settings.vm_class}</span></td>
        </tr>
        %{for host in variable.esx_settings.servers}
        <tr>
          <td><strong>ESXi Host</strong></td>
          <td>${host.name}.${input.domain_name}</td>
          <td>${host.ip}</td>
          <td>${variable.esx_settings.credentials.username}</td>
          <td><span class="label label-info">${variable.esx_settings.vm_class}</span></td>
        </tr>
        %{endfor}
      </table>
  vcf_deployment_json:
    value: |-
      {
        "version": "9.1.1.0",
        "vcfInstanceName": "vcf",
        "sddcId": "mgmt",
        "workflowType": "VCF",
        "ceipEnabled": false,
        "skipEsxThumbprintValidation": true,
        "dnsSpec": {
          "subdomain": "${input.domain_name}",
          "nameservers": [
            "${variable.vyos_settings.mgmt_ip}"
          ]
        },
        "ntpServers": [
          "${variable.vyos_settings.fqdn}"
        ],
        "hostSpecs": [
        %{for host in variable.esx_settings.servers}
          %{if host.name != variable.esx_settings.servers[0].name},%{endif}
          {
            "hostname": "${host.name}.${input.domain_name}",
            "credentials": {
              "username": "${variable.esx_settings.credentials.username}",
              "password": "${variable.esx_settings.credentials.password}"
            }
          }
        %{endfor}
        ],
        "networkSpecs": [
          {
            "networkType": "MANAGEMENT",
            "ipAddressVersion": "IPv4",
            "subnet": "${variable.netlayout.mgmt.ipaddresses}",
            "gateway": "${variable.netlayout.mgmt.defaultgw}",
            "vlanId": ${variable.netlayout.mgmt.vlanid},
            "activeUplinks": [
              "uplink1",
              "uplink2"
            ],
            "portGroupKey": "mgmt-cl01-vds01-pg-esx-mgmt",
            "standbyUplinks": [],
            "teamingPolicy": "loadbalance_loadbased"
          },
          {
            "networkType": "VMOTION",
            "ipAddressVersion": "IPv4",
            "subnet": "${variable.netlayout.vmotion.ipaddresses}",
            "gateway": "${variable.netlayout.vmotion.defaultgw}",
            "vlanId": ${variable.netlayout.vmotion.vlanid},
            "mtu": ${variable.netlayout.trunk.mtu},
            "includeIpAddressRanges": [
              {
                "startIpAddress": "${variable.netlayout.vmotion.ip_pool.start}",
                "endIpAddress": "${variable.netlayout.vmotion.ip_pool.end}"
              }
            ],
            "activeUplinks": [
              "uplink1",
              "uplink2"
            ],
            "portGroupKey": "mgmt-cl01-vds01-pg-vmotion",
            "standbyUplinks": [],
            "teamingPolicy": "loadbalance_loadbased"
          },
          {
            "networkType": "VSAN",
            "ipAddressVersion": "IPv4",
            "subnet": "${variable.netlayout.vsan.ipaddresses}",
            "gateway": "${variable.netlayout.vsan.defaultgw}",
            "vlanId": ${variable.netlayout.vsan.vlanid},
            "mtu": ${variable.netlayout.trunk.mtu},
            "includeIpAddressRanges": [
              {
                "startIpAddress": "${variable.netlayout.vsan.ip_pool.start}",
                "endIpAddress": "${variable.netlayout.vsan.ip_pool.end}"
              }
            ],
            "activeUplinks": [
              "uplink1",
